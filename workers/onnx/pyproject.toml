[project]
name = "troncut-sherpa-onnx"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# sherpa-onnx's sdist omits this native dependency; declare it for uv's lock resolver.
dependencies = [
    "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy>=1.26,<3",
    "luxtts-onnx @ https://github.com/ningyos/luxtts-onnx/archive/d29f673417d3bd8f82b8a2dda0131eb3eb6078e2.tar.gz",
    "piper-phonemize==1.5.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.uv.sources]
piper-phonemize = [
    { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.0/piper_phonemize-1.5.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.0/piper_phonemize-1.5.0-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.0/piper_phonemize-1.5.0-cp312-cp312-macosx_10_14_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.0/piper_phonemize-1.5.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.0/piper_phonemize-1.5.0-cp312-cp312-manylinux2014_aarch64.manylinux_2_17_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
