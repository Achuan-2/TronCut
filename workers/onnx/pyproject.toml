[project]
name = "troncut-sherpa-onnx"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# sherpa-onnx's sdist omits this native dependency; declare it for uv's lock resolver.
dependencies = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy>=1.26,<3"]

[project.optional-dependencies]
qwen-gpu = ["qwen-asr==0.0.6", "torch==2.9.1", "torchaudio==2.9.1"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
