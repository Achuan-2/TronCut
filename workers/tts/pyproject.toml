[project]
name = "troncut-tts"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["soundfile>=0.13,<1", "torch==2.9.1", "transformers==4.57.3"]

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
    "misaki[zh]==0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
qwen = ["qwen-tts==0.1.1", "torchaudio==2.9.1"]
cpu = ["torch==2.9.1", "torchaudio==2.9.1"]
cuda = ["torch==2.9.1", "torchaudio==2.9.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
